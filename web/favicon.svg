<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1612"/>
      <stop offset="100%" stop-color="#173026"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8F0CE"/>
      <stop offset="55%" stop-color="#5ED3A0"/>
      <stop offset="100%" stop-color="#2E8B67"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDFBEF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#48B88A" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#356F59" stroke-width="1.5"/>
  <!-- Outer hypercube hexagonal hull -->
  <polygon points="32,9 51,20 51,44 32,55 13,44 13,20" fill="none" stroke="url(#prism)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 4D tesseract projection struts -->
  <g stroke="#58C898" stroke-width="1.5" stroke-linecap="round" opacity="0.72">
    <line x1="32" y1="9" x2="32" y2="19"/>
    <line x1="51" y1="20" x2="42" y2="25.5"/>
    <line x1="51" y1="44" x2="42" y2="38.5"/>
    <line x1="32" y1="55" x2="32" y2="45"/>
    <line x1="13" y1="44" x2="22" y2="38.5"/>
    <line x1="13" y1="20" x2="22" y2="25.5"/>
  </g>
  <!-- Inner suspended tesseract cell -->
  <polygon points="32,19 42,25.5 42,38.5 32,45 22,38.5 22,25.5" fill="url(#core)" stroke="#9DF0C8" stroke-width="1.9" stroke-linejoin="round"/>
  <!-- Inner octahedron lattice -->
  <polygon points="32,19 42,32 32,45 22,32" fill="none" stroke="#C8F9E2" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>
  <line x1="22" y1="25.5" x2="42" y2="38.5" stroke="#7AE2B4" stroke-width="1.1" opacity="0.55"/>
  <line x1="42" y1="25.5" x2="22" y2="38.5" stroke="#7AE2B4" stroke-width="1.1" opacity="0.55"/>
  <!-- Neural vertex nodes & central singularity -->
  <g fill="#E6FFF4">
    <circle cx="32" cy="9" r="2.1"/>
    <circle cx="51" cy="20" r="2.1"/>
    <circle cx="51" cy="44" r="2.1"/>
    <circle cx="32" cy="55" r="2.1"/>
    <circle cx="13" cy="44" r="2.1"/>
    <circle cx="13" cy="20" r="2.1"/>
    <circle cx="32" cy="32" r="3.2" fill="#FFFFFF"/>
  </g>
</svg>
