name: Apply Archiver 5.6 full fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-56-full.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply 5.6 patches
        run: |
          echo "" | base64 -d > /tmp/apply_56.py
          python3 /tmp/apply_56.py
      - name: Verify versions
        run: |
          grep -n "VERSION = '5.6'" web/archiver-engine.js | head -1
          grep -n "VERSION = '5.6'" web/archiver-prep.js | head -1
          grep -n "CACHE_VERSION = '5.6.0'" web/archiver-coi-sw.js | head -1
          grep -n 'version-tag">5.6' web/index.html | head -1
          ! grep -q 'Show tuning' web/index.html || (echo still has tuning; exit 1)
          ! grep -q 'id="discordWidget"' web/index.html || (echo still has discord; exit 1)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "Archiver 5.6: engine 5.6, browser search, Discord/tuning cleanup, auto-init on open" || echo "nothing to commit"
          git push origin HEAD:main
