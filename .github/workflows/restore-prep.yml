name: Restore prep
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-prep.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore prep.js
        run: |
          set -eux
          git show c993a6bc21e6e270515f835b22e531ba256555cd:web/archiver-prep.js > web/archiver-prep.js
          wc -c web/archiver-prep.js
          head -3 web/archiver-prep.js
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/archiver-prep.js
          if git diff --cached --quiet; then
            echo 'no change'
          else
            git commit -m 'Archiver 5.6: restore full prep.js from c993a6bc'
            git push
          fi
